<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>通关考 · 手机预览</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%;
      background: #1c1917;
      display: flex; align-items: center; justify-content: center;
      font-family: system-ui, sans-serif;
    }
    .stage { display: flex; flex-direction: column; align-items: center; gap: 14px; }
    .label { color: #a8a29e; font-size: 13px; letter-spacing: 0.02em; }
    .phone {
      width: 390px; height: 844px;
      border-radius: 44px;
      background: #0c0a09;
      padding: 12px;
      box-shadow:
        0 0 0 3px #44403c,
        0 0 0 6px #292524,
        0 25px 50px rgba(0,0,0,.55);
      position: relative;
    }
    .notch {
      position: absolute; top: 18px; left: 50%; transform: translateX(-50%);
      width: 120px; height: 28px; background: #0c0a09;
      border-radius: 20px; z-index: 2;
    }
    .screen {
      width: 100%; height: 100%;
      border-radius: 34px; overflow: hidden;
      background: #fff;
    }
    iframe { width: 100%; height: 100%; border: 0; display: block; }
    .home-bar {
      position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
      width: 120px; height: 4px; background: #57534e; border-radius: 4px; z-index: 2;
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="label">黄冈通关考 · 虚拟手机预览（390×844）</div>
    <div class="phone">
      <div class="notch"></div>
      <div class="screen">
        <iframe src="./index.html" title="通关考答题页"></iframe>
      </div>
      <div class="home-bar"></div>
    </div>
  </div>
</body>
</html>
